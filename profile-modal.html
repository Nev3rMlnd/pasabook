<div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">

      <div class="text-center mb-3">
  <img src="images/PASABOOK LOGO.png" alt="PasaBook Logo" style="max-width:180px;width:100%;height:auto;">
</div>
      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item flex-fill text-center" role="presentation">
          <button class="nav-link active w-100" id="loginTab" data-bs-toggle="tab" data-bs-target="#tabLogin" type="button" role="tab">Log In</button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
          <button class="nav-link w-100" id="signupTab" data-bs-toggle="tab" data-bs-target="#tabSignup" type="button" role="tab">Sign Up</button>
        </li>
      </ul>

      <!-- Tab content -->
      <div class="tab-content">

        <div class="tab-pane fade show active" id="tabLogin" role="tabpanel">
          <form>
            <div class="mb-3">
              <label class="form-label small fw-medium">Email</label>
              <input type="email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-medium">Password</label>
              <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
          </form>
        </div>

        <div class="tab-pane fade" id="tabSignup" role="tabpanel">
          <form>
            <div class="mb-3">
              <label class="form-label small fw-medium">Full Name</label>
              <input type="text" class="form-control" placeholder="Juan Dela Cruz">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-medium">Email</label>
              <input type="email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-medium">Password</label>
              <input type="password" class="form-control" placeholder="Min. 8 characters">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
